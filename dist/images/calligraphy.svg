<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#042f24" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed65b" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#aa861e" />
      <stop offset="100%" stop-color="#f5e18e" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <!-- Star Pattern -->
    <pattern id="islamicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16 Z" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.12" />
      <circle cx="20" cy="20" r="3" fill="#D4AF37" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern Overlay -->
  <rect width="100%" height="100%" rx="16" fill="url(#islamicGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="110" fill="url(#goldGlow)" filter="blur(20px)" />

  <!-- Outer Arabesque Frame -->
  <rect x="14" y="14" width="372" height="272" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5" />
  <rect x="20" y="20" width="360" height="260" rx="8" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="4,4" />

  <!-- Corner Ornaments (8-Point Star Corners) -->
  <g fill="url(#goldGrad)">
    <!-- Top-Left -->
    <path d="M20 20 L24 24 L20 28 L16 24 Z" />
    <!-- Top-Right -->
    <path d="M380 20 L384 24 L380 28 L376 24 Z" />
    <!-- Bottom-Left -->
    <path d="M20 280 L24 284 L20 288 L16 284 Z" />
    <!-- Bottom-Right -->
    <path d="M380 280 L384 284 L380 288 L376 284 Z" />
  </g>

  <!-- Center Decorative Medallion -->
  <g transform="translate(200, 150)">
    <!-- Outer Medallion Border -->
    <circle r="75" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7" />
    <circle r="70" fill="#022c22" fill-opacity="0.6" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.4" />
    
    <!-- Central Islamic 8-Point Star -->
    <path d="M0 -60 L14 -14 L60 0 L14 14 L0 60 L-14 14 L-60 0 L-14 -14 Z" fill="#D4AF37" fill-opacity="0.08" />
    <path d="M-42 -42 L0 -20 L42 -42 L20 0 L42 42 L0 20 L-42 42 L-20 0 Z" fill="#D4AF37" fill-opacity="0.08" />

    <!-- Quranic Calligraphy Centerpiece: Al-Quran Al-Karim -->
    <!-- Arabic Calligraphy in Path Representation & Styled Typography -->
    <text
      x="0"
      y="8"
      text-anchor="middle"
      fill="url(#goldGrad)"
      font-family="'Amiri', 'Amiri Quran', 'Scheherazade New', 'Traditional Arabic', serif"
      font-size="34"
      font-weight="bold"
      letter-spacing="1"
      filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.6))"
    >
      القرآن الكريم
    </text>

    <!-- Subtitle (Holy Quran) -->
    <text
      x="0"
      y="32"
      text-anchor="middle"
      fill="#80bea6"
      font-family="'Inter', sans-serif"
      font-size="8"
      font-weight="600"
      letter-spacing="3"
      opacity="0.9"
    >
      THE NOBLE QUR'AN
    </text>
  </g>
</svg>
